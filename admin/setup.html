<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعداد حساب المشرف — لوحة تحكم بيسان</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#006184">
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<main class="auth-wrap">
<div class="bs-card bs-card-xl auth-card p-lg p-md-xl d-flex flex-column gap-lg">
    <div class="text-center d-flex flex-column gap-sm align-items-center">
      <span class="icon-tile"><span class="material-symbols-outlined">admin_panel_settings</span></span>
      <h1 class="t-headline-md c-on-surface">إنشاء حساب المشرف الأول</h1>
      <p class="t-body-md c-variant">هذه الصفحة تظهر مرة واحدة فقط عند تشغيل الموقع لأول مرة.</p>
    </div>

    <div class="form-alert error d-none" role="alert" id="authAlert"><span class="material-symbols-outlined">error</span><span></span></div>

    <form id="setupForm" class="d-flex flex-column gap-md" novalidate>
      <label class="field"><span class="lbl">الاسم</span><input name="name" required minlength="2" class="form-control" placeholder="م. سامر بيسان"></label>
      <label class="field"><span class="lbl">البريد الإلكتروني</span><input type="email" name="email" required class="form-control" autocomplete="username"></label>
      <label class="field"><span class="lbl">كلمة المرور (8 أحرف على الأقل)</span><input type="password" name="password" required minlength="8" class="form-control" autocomplete="new-password"></label>
      <label class="field"><span class="lbl">تأكيد كلمة المرور</span><input type="password" name="password2" required minlength="8" class="form-control" autocomplete="new-password"></label>
      <button type="submit" class="btn-bs btn-primary-bs btn-lg-bs w-100"><span class="material-symbols-outlined">person_add</span><span>إنشاء الحساب والدخول</span></button>
    </form>
  </div>
</main>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
