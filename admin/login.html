<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المشرف — لوحة تحكم بيسان</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#006184">
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<main class="auth-wrap">
<div class="bs-card bs-card-xl auth-card p-lg p-md-xl d-flex flex-column gap-lg">
    <div class="d-flex flex-column align-items-center text-center gap-sm">
      <img src="../assets/img/logo.png" data-admin-logo alt="شعار الشركة" width="64" height="64" style="border-radius:50%;object-fit:contain;border:1px solid var(--c-outline-faint)">
      <h1 class="t-headline-md c-on-surface">لوحة تحكم المشرف</h1>
      <p class="t-body-md c-variant">سجل الدخول لإدارة المنتجات وطلبات الصيانة ورسائل العملاء</p>
    </div>

    <div class="form-alert error d-none" role="alert" id="authAlert"><span class="material-symbols-outlined">error</span><span></span></div>

    <form id="loginForm" class="d-flex flex-column gap-md" novalidate>
      <label class="field">
        <span class="lbl">البريد الإلكتروني</span>
        <span class="input-icon">
          <span class="material-symbols-outlined">mail</span>
          <input type="email" name="email" required autofocus autocomplete="username" class="form-control" placeholder="admin@bisan-hvac.ps">
        </span>
      </label>
      <label class="field">
        <span class="lbl">كلمة المرور</span>
        <span class="input-icon">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" name="password" required autocomplete="current-password" class="form-control" placeholder="••••••••">
        </span>
      </label>
      <div class="d-flex align-items-center justify-content-between">
        <label class="check-bs"><input type="checkbox" name="remember" value="1"><span>تذكرني</span></label>
        <a href="#" class="t-label-sm c-primary" data-bs-toggle="collapse" data-bs-target="#forgot" aria-expanded="false">نسيت كلمة المرور؟</a>
      </div>
      <div id="forgot" class="collapse">
        <p class="t-body-md c-variant bg-surface-low p-3 rounded-3">تواصل مع المشرف العام لإعادة تعيين كلمة المرور من صفحة "المشرفون" في لوحة التحكم.</p>
      </div>
      <button type="submit" class="btn-bs btn-primary-bs btn-lg-bs w-100">
        <span class="material-symbols-outlined">login</span><span>تسجيل الدخول</span>
      </button>
    </form>

    <a href="../index.html" class="link-bs justify-content-center">
      <span class="material-symbols-outlined ms-18">arrow_forward</span><span>العودة إلى موقع الزوار</span>
    </a>
  </div>
</main>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
