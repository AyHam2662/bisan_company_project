<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج — شركة بيسان للتكييف والتبريد</title>
  <meta name="description" content="حلول التكييف والتبريد في فلسطين: بيع، تركيب، وصيانة.">
  <meta name="theme-color" content="#006184">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="products">
<a href="#main" class="visually-hidden-focusable btn-bs btn-primary-bs position-absolute m-2" style="z-index:2000">تخطَّ إلى المحتوى</a>

<div data-include="partials/header.html"></div>

<main id="main">
<div class="container-bs page-head pb-5 d-flex flex-column gap-xl" id="productPage">
  <nav aria-label="مسار التنقل" class="breadcrumb-bs">
      <a href="index.html">الرئيسية</a>
      <span class="material-symbols-outlined">chevron_left</span>
      <a href="products.html">المنتجات</a>
      <span class="d-none" id="crumbCat"><span class="material-symbols-outlined">chevron_left</span><a href="#"></a></span>
      <span class="material-symbols-outlined">chevron_left</span>
      <span class="current" id="crumbName">…</span>
    </nav>

  <div class="row g-4 g-lg-5 align-items-start">
    <div class="col-lg-6">
      <div class="gallery-main">
        <img id="pImage" src="assets/img/placeholder.svg" alt="">
      </div>
    </div>

    <div class="col-lg-6 d-flex flex-column gap-md">
      <div class="bs-card p-lg d-flex flex-column gap-md">
        <div class="d-flex align-items-center justify-content-between gap-sm flex-wrap">
          <span class="t-label-lg c-primary">العلامة التجارية: <span id="pBrand"></span></span>
          <span id="pStock"></span>
        </div>
        <h1 class="t-headline-md c-on-surface" id="pName"></h1>
        <p class="mono c-variant d-none" dir="ltr" style="text-align:right" id="pModel"></p>

        <div class="py-2 divider-top divider-bottom d-flex align-items-baseline gap-md flex-wrap">
          <span class="t-display-md c-primary tabular" id="pPrice"></span>
          <span class="t-body-md c-variant" id="pWarranty"></span>
        </div>

        <p class="t-body-lg c-variant text-pretty" id="pDesc" style="white-space:pre-line"></p>

        <div class="d-flex flex-wrap align-items-center gap-md pt-1">
          <a href="maintenance.html" class="btn-bs btn-primary-bs btn-lg-bs flex-grow-1" data-order>
            <span class="material-symbols-outlined" aria-hidden="true">shopping_bag</span><span>اطلب هذا المنتج</span>
          </a>
          <a href="maintenance.html" class="btn-bs btn-outline-bs btn-lg-bs" data-order>
            <span class="material-symbols-outlined" aria-hidden="true">handyman</span><span>طلب معاينة وتركيب</span>
          </a>
        </div>
      </div>

      <div class="bs-card overflow-hidden d-none" id="specsCard">
        <h2 class="t-title-lg c-on-surface card-head">المواصفات الفنية</h2>
        <table class="table-bs specs-table">
          <tbody id="specsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <section class="d-flex flex-column gap-lg pt-3 d-none" id="similarSection">
    <h2 class="t-headline-md c-on-surface">منتجات مشابهة</h2>
    <div class="grid-cards cols-4" id="similarGrid"></div>
  </section>
</div>

<div class="container-bs section d-none" id="notFound">
  <div class="bs-card empty-state">
    <span class="material-symbols-outlined">inventory_2</span>
    <h1 class="t-headline-sm c-on-surface">المنتج غير موجود</h1>
    <p>ربما تم حذفه أو تغيير رابطه.</p>
    <a href="products.html" class="btn-bs btn-primary-bs mt-2">العودة إلى الكتالوج</a>
  </div>
</div>
</main>

<div data-include="partials/footer.html"></div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/product.js"></script>
</body>
</html>
