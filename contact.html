<body data-page="contact">
<a href="#main" class="visually-hidden-focusable btn-bs btn-primary-bs position-absolute m-2" style="z-index:2000">تخطَّ إلى المحتوى</a>

<div data-include="partials/header.html"></div>

<main id="main">
<div class="container-bs page-head pb-5 d-flex flex-column gap-xl">
  <div class="d-flex flex-column gap-xs">
    <nav aria-label="مسار التنقل" class="breadcrumb-bs">
      <a href="index.html">الرئيسية</a>
      <span class="material-symbols-outlined">chevron_left</span>
      <span class="current">اتصل بنا</span>
    </nav>
    <h1 class="t-headline-lg c-on-surface">اتصل بنا</h1>
    <p class="t-body-lg c-variant">يسعدنا استقبال استفساراتكم وطلبات عروض الأسعار في جميع محافظات الضفة الغربية والقدس.</p>
  </div>

  <div class="row g-4 g-lg-5">
    <div class="col-lg-6">
      <div class="bs-card p-lg p-md-xl h-100">
        <h2 class="t-headline-sm c-on-surface mb-3">أرسل لنا رسالة</h2>
        <form data-ajax="api/request.php" class="row g-3" novalidate>
      <input type="hidden" name="form" value="contact">
      <input type="text" name="website" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="col-sm-6"><label class="field">
        <span class="lbl">الاسم <span class="req">*</span></span>
        <input type="text" name="name" required minlength="2" maxlength="150" class="form-control" placeholder="الاسم الكامل" autocomplete="name">
      </label></div>
      <div class="col-sm-6"><label class="field">
        <span class="lbl">البريد الإلكتروني <span class="req">*</span></span>
        <input type="email" name="email" required maxlength="150" class="form-control" placeholder="name@domain.ps" autocomplete="email">
      </label></div>
      <div class="col-sm-6"><label class="field">
        <span class="lbl">الهاتف</span>
        <input type="tel" name="phone" maxlength="20" pattern="[0-9+\-\s\(\)]{7,20}" class="form-control tabular" placeholder="0599-000-000" dir="ltr" style="text-align:right" autocomplete="tel">
      </label></div>
      <div class="col-sm-6"><label class="field">
        <span class="lbl">الموضوع <span class="req">*</span></span>
        <input type="text" name="subject" required minlength="3" maxlength="200" class="form-control" placeholder="استفسار عن عرض سعر لمشروع">
      </label></div>
      <div class="col-12"><label class="field">
        <span class="lbl">الرسالة <span class="req">*</span></span>
        <textarea name="message" rows="4" required minlength="5" maxlength="3000" class="form-control" placeholder="اكتب رسالتك هنا..."></textarea>
      </label></div>
      <div class="col-12"><div class="form-alert d-none" role="alert"></div></div>
      <div class="col-12">
        <button type="submit" class="btn-bs btn-primary-bs">
          <span class="material-symbols-outlined" aria-hidden="true">send</span>
          <span>إرسال الرسالة</span>
        </button>
      </div>
    </form>
      </div>
    </div>
    <div class="col-lg-6 d-flex flex-column gap-lg">
      <div class="bs-card p-lg row g-3 m-0">
      <div class="col-sm-6 d-flex align-items-start gap-sm">
        <span class="material-symbols-outlined c-primary">call</span>
        <div>
          <h3 class="t-label-lg c-on-surface">الهاتف والموبايل</h3>
          <p class="t-body-md c-variant tabular" dir="ltr" style="text-align:right">
            <a class="c-variant" href="#" data-href="phone_href" data-text="phone"></a><br><a class="c-variant" href="#" data-href="mobile_href" data-text="mobile"></a>
          </p>
        </div>
      </div>
      <div class="col-sm-6 d-flex align-items-start gap-sm">
        <span class="material-symbols-outlined c-primary">mail</span>
        <div>
          <h3 class="t-label-lg c-on-surface">البريد الإلكتروني</h3>
          <p class="t-body-md c-variant">
            <a class="c-variant" href="#" data-href="email_href" data-text="email"></a><span data-show-if="sales_email" class="d-none"><br><a class="c-variant" href="#" data-href="sales_email_href" data-text="sales_email"></a></span>
          </p>
        </div>
      </div>
      <div class="col-sm-6 d-flex align-items-start gap-sm">
        <span class="material-symbols-outlined c-primary">location_on</span>
        <div>
          <h3 class="t-label-lg c-on-surface">العنوان الرئيسي</h3>
          <p class="t-body-md c-variant" data-text="address"></p>
        </div>
      </div>
      <div class="col-sm-6 d-flex align-items-start gap-sm">
        <span class="material-symbols-outlined c-primary">schedule</span>
        <div>
          <h3 class="t-label-lg c-on-surface">ساعات العمل</h3>
          <p class="t-body-md c-variant" data-text="working_hours"></p>
        </div>
      </div>
    </div>
      <div class="bs-card map-box p-md flex-grow-1" data-map>
      <span class="material-symbols-outlined ms-40 c-primary">map</span>
      <p class="t-title-md c-on-surface">خريطة موقع معرض <span data-text="company_short"></span></p>
      <p class="t-body-md c-variant" data-text="address_note"></p>
    </div>
    </div>
  </div>
</div>
</main>
